<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify your SafeKeep Account</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #3b82f6; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; }
    </style>
</head>
<body>
<div class="container">
    <h2>Welcome to SafeKeep, <span th:text="${userName}">User</span>!</h2>
    <p>Please use the following 6-digit verification code to activate your account:</p>
    <div style="text-align: center; margin: 30px 0;">
        <span th:text="${verificationCode}" style="display: inline-block; padding: 14px 28px; background-color: #f3f4f6; color: #7c6fcd; border: 2px dashed #7c6fcd; border-radius: 6px; font-weight: bold; font-size: 24px; letter-spacing: 4px;"></span>
    </div>
    <p>This code will expire shortly. If you did not create this account, please ignore this email.</p>
    <div class="footer">
        <p>SafeKeep — Secure Digital Legacy</p>
    </div>
</div>
</body>
</html>
