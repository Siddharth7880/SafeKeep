# ============================================================
# LOCAL DEVELOPMENT — Fill in your values
# Copy from application.properties.example
# ============================================================

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/safekeep}
spring.datasource.username=${DB_USERNAME:safekeep_user}
spring.datasource.password=${DB_PASSWORD:changeme_local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIGRldi1vbmx5IHNlY3JldCBrZXkgdGhhdCBtdXN0IGJlIGNoYW5nZWQgaW4gcHJvZHVjdGlvbiEhIQ==}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Quartz — In-memory for local dev (switch to JDBC for production)
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.scheduler.instanceName=SafeKeepLocalScheduler
spring.quartz.properties.org.quartz.threadPool.threadCount=3

# Email — Brevo REST API
brevo.api-key=${BREVO_API_KEY:your-brevo-api-key}
brevo.sender.email=${MAIL_USERNAME:noreply@safekeep.com}
brevo.sender.name=SafeKeep — Digital Legacy
spring.thymeleaf.cache=false

app.base-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
app.release.token-secret=${RELEASE_TOKEN_SECRET:local-dev-release-token-secret-change-in-prod}
app.release.token-expiry-hours=72

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.safekeep=DEBUG
logging.level.org.quartz=WARN
logging.level.org.springframework.security=DEBUG

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
