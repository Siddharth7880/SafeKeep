name: SafeKeep CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  # ==================== Backend ====================
  backend:
    name: Backend — Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests (AesEncryptionUtilTest)
        working-directory: backend
        run: ./mvnw -B test -Dtest="AesEncryptionUtilTest" -DfailIfNoTests=false

      - name: Compile production code
        working-directory: backend
        run: ./mvnw -B compile

  # ==================== Backend Integration Tests ====================
  backend-integration:
    name: Backend — Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    # Testcontainers requires Docker — ubuntu-latest has Docker installed
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        working-directory: backend
        env:
          # Secrets injected from GitHub repository secrets
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET || 'ci-test-jwt-secret-minimum-32-chars-long' }}
          APP_RELEASE_TOKEN_SECRET: ${{ secrets.APP_RELEASE_TOKEN_SECRET || 'ci-test-release-secret-32-chars!!' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || 'test-brevo-key' }}
        run: ./mvnw -B test -Dtest="VaultIntegrationTest" -DfailIfNoTests=false

  # ==================== Frontend ====================
  frontend:
    name: Frontend — Build & Crypto Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest crypto unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  # ==================== Security Scan ====================
  security:
    name: Security — Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Frontend npm audit (informational)
        working-directory: frontend
        run: npm audit --audit-level=high || true
        # '|| true' so high-severity issues are reported but don't block CI
        # Remove '|| true' to make security vulnerabilities block merges

      - name: Backend OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SafeKeep'
          path: 'backend'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 9
            --enableRetired
        continue-on-error: true
        # continue-on-error: remove when ready to enforce zero critical CVEs

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: reports/
